<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chest Cancer AI | MLOps Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');

:root {
  --bg: #020617;
  --glass: rgba(15, 23, 42, 0.75);
  --border: rgba(148,163,184,.15);
  --accent: #38bdf8;
  --accent2: #6366f1;
  --success: #22c55e;
  --danger: #ef4444;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

* {
  box-sizing: border-box;
  font-family: 'Inter', system-ui, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 20%, rgba(56,189,248,.15), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(99,102,241,.18), transparent 45%),
    #020617;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.app {
  width: 96%;
  max-width: 1150px;
  padding: 30px;
  border-radius: 26px;
  background: linear-gradient(180deg, rgba(2,6,23,.9), rgba(2,6,23,.75));
  box-shadow: 0 50px 120px rgba(0,0,0,.75);
  border: 1px solid var(--border);
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}

.logo {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .4px;
}

.logo span {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  color: transparent;
}

.tagline {
  font-size: 13px;
  color: var(--muted);
}

.status {
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(56,189,248,.15);
  color: var(--accent);
  font-size: 13px;
  font-weight: 500;
}

/* Layout */
.grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 26px;
}

@media(max-width: 900px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

/* Cards */
.card {
  background: var(--glass);
  border-radius: 22px;
  padding: 26px;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 60%, rgba(255,255,255,.03));
  pointer-events: none;
}

.card h3 {
  margin-top: 0;
  margin-bottom: 18px;
  font-size: 20px;
}

/* Upload */
.upload {
  border: 2px dashed rgba(148,163,184,.25);
  border-radius: 18px;
  padding: 34px;
  text-align: center;
  cursor: pointer;
  transition: .35s ease;
}

.upload:hover {
  border-color: var(--accent);
  background: rgba(56,189,248,.05);
}

.upload strong {
  font-size: 16px;
}

.upload p {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.upload input {
  display: none;
}

.preview img {
  width: 100%;
  max-height: 320px;
  margin-top: 18px;
  border-radius: 14px;
  display: none;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  animation: zoom .45s ease;
}

@keyframes zoom {
  from { opacity: 0; transform: scale(.95); }
  to { opacity: 1; transform: scale(1); }
}

/* Button */
.btn {
  margin-top: 22px;
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: .3s ease;
  box-shadow: 0 10px 30px rgba(56,189,248,.35);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 45px rgba(56,189,248,.55);
}

/* Result */
.spinner {
  width: 46px;
  height: 46px;
  border: 5px solid rgba(255,255,255,.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 40px auto;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.prediction {
  text-align: center;
  display: none;
}

.prediction h1 {
  font-size: 32px;
  margin-bottom: 6px;
}

.badge {
  display: inline-block;
  padding: 7px 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}

.good {
  background: rgba(34,197,94,.15);
  color: var(--success);
}

.bad {
  background: rgba(239,68,68,.15);
  color: var(--danger);
}

.progress {
  height: 10px;
  background: rgba(255,255,255,.08);
  border-radius: 99px;
  overflow: hidden;
  margin: 18px 0 10px;
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  transition: .7s ease;
}

.meta {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 14px;
  margin-top: 22px;
}

.meta div {
  background: rgba(255,255,255,.04);
  padding: 14px;
  border-radius: 14px;
  font-size: 13px;
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 26px;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div>
    <div class="logo">Chest<span>AI</span> Platform</div>
    <div class="tagline">Automated Cancer Detection • MLOps Production Pipeline</div>
  </div>
  <div class="status">Live Model</div>
</div>

<div class="grid">

<!-- Upload Card -->
<div class="card">
  <h3>Upload Chest Scan</h3>

  <label class="upload">
    <input type="file" id="fileInput" accept="image/*">
    <strong>📤 Click or Drop Image</strong>
    <p>High-resolution CT/X-ray supported</p>
  </label>

  <div class="preview">
    <img id="preview">
  </div>

  <button class="btn" onclick="runInference()">Run AI Analysis</button>
</div>

<!-- Result Card -->
<div class="card">
  <h3>Prediction</h3>

  <div class="spinner" id="loader"></div>

  <div class="prediction" id="prediction">
    <h1 id="label">Normal</h1>
    <div id="risk" class="badge good">Low Risk</div>

    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>

    <div id="confidence" style="color:var(--muted)"></div>

    <div class="meta">
      <div>Model<br><b>ResNet50</b></div>
      <div>MLflow<br><b>v18</b></div>
      <div>Latency<br><b>110ms</b></div>
    </div>
  </div>
</div>

</div>

<div class="footer">
© 2026 • MLflow • DVC • CI/CD • Docker • Production Ready System
</div>

</div>

<script>
const input = document.getElementById("fileInput");
const preview = document.getElementById("preview");

input.addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    preview.src = reader.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

function runInference() {
  if(!input.files.length){
    alert("Please upload an image first.");
    return;
  }

  const loader = document.getElementById("loader");
  const prediction = document.getElementById("prediction");

  loader.style.display = "block";
  prediction.style.display = "none";

  setTimeout(() => {
    loader.style.display = "none";
    prediction.style.display = "block";

    const healthy = Math.random() > 0.5;
    const confidence = Math.floor(90 + Math.random() * 8);

    document.getElementById("label").innerText = healthy ? "Normal" : "Cancer Detected";
    document.getElementById("confidence").innerText = "Confidence: " + confidence + "%";
    document.getElementById("bar").style.width = confidence + "%";

    const risk = document.getElementById("risk");
    risk.innerText = healthy ? "Low Risk" : "High Risk";
    risk.className = healthy ? "badge good" : "badge bad";

  }, 1600);
}
</script>

</body>
</html>
